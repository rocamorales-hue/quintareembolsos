<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Financiero - Quinta Bugambilia</title>
  
  <!-- CSS de Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome para Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 para notificaciones -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.2s; }
    .kpi-card:hover { transform: translateY(-5px); }
    .header-title { color: #2c3e50; font-weight: 800; letter-spacing: -0.5px; }
    .icon-box { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    
    /* Colores Estatus */
    .badge-Pagado { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
    .badge-Parcial { background-color: #fff3cd; color: #664d03; border: 1px solid #ffecb5; }
    .badge-Pendiente { background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
    
    .table-container { max-height: 500px; overflow-y: auto; border-radius: 0 0 15px 15px; }
    .table thead th { background-color: #f1f4f9; color: #495057; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; }
    .btn-custom { border-radius: 8px; font-weight: 600; padding: 10px 20px; }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="header-title mb-0"><i class="fa-solid fa-leaf text-success me-2"></i> Quinta Bugambilia</h2>
    <span class="text-muted"><i class="fa-solid fa-chart-line me-1"></i> Panel de Finanzas</span>
  </div>

  <!-- TARJETAS DE INDICADORES (KPIs) -->
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card kpi-card h-100 p-3">
        <div class="d-flex align-items-center">
          <div class="icon-box bg-primary text-white me-3"><i class="fa-solid fa-wallet"></i></div>
          <div>
            <p class="text-muted mb-0 small fw-bold text-uppercase">Total Gastado</p>
            <h3 class="mb-0 fw-bold" id="kpiGastado">$0.00</h3>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card kpi-card h-100 p-3">
        <div class="d-flex align-items-center">
          <div class="icon-box bg-success text-white me-3"><i class="fa-solid fa-hand-holding-dollar"></i></div>
          <div>
            <p class="text-muted mb-0 small fw-bold text-uppercase">Total Reembolsado</p>
            <h3 class="mb-0 fw-bold" id="kpiAbonado">$0.00</h3>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card kpi-card h-100 p-3">
        <div class="d-flex align-items-center">
          <div class="icon-box bg-danger text-white me-3"><i class="fa-solid fa-file-invoice-dollar"></i></div>
          <div>
            <p class="text-muted mb-0 small fw-bold text-uppercase">Deuda Pendiente</p>
            <h3 class="mb-0 fw-bold text-danger" id="kpiPendiente">$0.00</h3>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FORMULARIOS -->
  <div class="row g-4 mb-4">
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
          <h5 class="fw-bold text-primary"><i class="fa-solid fa-arrow-up-right-dots me-2"></i>Registrar Gasto</h5>
        </div>
        <div class="card-body">
          <form id="formGasto">
            <div class="row g-2 mb-3">
              <div class="col-sm-5">
                <label class="form-label small text-muted">Fecha</label>
                <input type="date" class="form-control" id="fechaGasto" required>
              </div>
              <div class="col-sm-7">
                <label class="form-label small text-muted">Monto Pagado ($)</label>
                <div class="input-group">
                  <span class="input-group-text bg-light">$</span>
                  <input type="number" step="0.01" class="form-control" id="montoGasto" placeholder="0.00" required>
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted">Concepto</label>
              <input type="text" class="form-control" id="conceptoGasto" placeholder="Ej. Cloro para alberca..." required>
            </div>
            <button type="button" class="btn btn-primary btn-custom w-100" onclick="guardarGasto()">
              <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Gasto
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
          <h5 class="fw-bold text-success"><i class="fa-solid fa-money-bill-transfer me-2"></i>Recibir Reembolso</h5>
        </div>
        <div class="card-body">
          <form id="formReembolso">
            <div class="row g-2 mb-3">
              <div class="col-sm-5">
                <label class="form-label small text-muted">Fecha</label>
                <input type="date" class="form-control" id="fechaReembolso" required>
              </div>
              <div class="col-sm-7">
                <label class="form-label small text-muted">Monto Depositado ($)</label>
                <div class="input-group">
                  <span class="input-group-text bg-light">$</span>
                  <input type="number" step="0.01" class="form-control" id="montoReembolso" placeholder="0.00" required>
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted">Notas / Referencia</label>
              <input type="text" class="form-control" id="notasReembolso" placeholder="Ej. Transferencia Banorte">
            </div>
            <button type="button" class="btn btn-success btn-custom w-100" onclick="procesarReembolso()">
              <i class="fa-solid fa-check-double me-1"></i> Aplicar a Deudas
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- TABLA HISTÓRICA Y FILTROS -->
  <div class="card mb-5">
    <div class="card-header bg-white border-bottom pt-3 pb-3">
      <div class="row align-items-center g-2">
        <div class="col-md-4">
          <h5 class="fw-bold mb-0"><i class="fa-solid fa-table-list me-2 text-secondary"></i>Historial de Gastos</h5>
        </div>
        <div class="col-md-8">
          <div class="d-flex gap-2 justify-content-md-end">
            <div class="input-group w-auto">
              <span class="input-group-text bg-light"><i class="fa-solid fa-magnifying-glass"></i></span>
              <input type="text" class="form-control" id="searchConcepto" placeholder="Buscar concepto..." onkeyup="aplicarFiltros()">
            </div>
            <select class="form-select w-auto" id="filterEstatus" onchange="aplicarFiltros()">
              <option value="Todos">Todos los estatus</option>
              <option value="Pendiente">Pendientes</option>
              <option value="Parcial">Parciales</option>
              <option value="Pagado">Pagados</option>
            </select>
            <button class="btn btn-dark" onclick="exportarCSV()" title="Descargar Excel/CSV">
              <i class="fa-solid fa-download"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="card-body p-0 table-container">
      <table class="table table-hover align-middle mb-0 text-center">
        <thead class="sticky-top">
          <tr>
            <th>Fecha</th>
            <th class="text-start">Concepto</th>
            <th>Costo</th>
            <th>Abonado</th>
            <th>Saldo Pendiente</th>
            <th>Estatus</th>
          </tr>
        </thead>
        <tbody id="tablaGastos">
          <tr>
            <td colspan="6" class="text-center text-muted py-5">
              <div class="spinner-border text-primary mb-2" role="status"></div>
              <div>Conectando con Google Sheets...</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Tu API de Google Apps Script (Intacta)
  const API_URL = "https://script.google.com/macros/s/AKfycbz-IgvNztN2FAmFc13XDjqtu-fRxNnOihXTWlTDfSqBVIepK8FpiommOCU6YOU9gUBB/exec";
  
  // Variable global para almacenar los datos y filtrar sin recargar
  let datosGlobales = [];

  document.addEventListener('DOMContentLoaded', function() {
    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById('fechaGasto').value = hoy;
    document.getElementById('fechaReembolso').value = hoy;
    cargarTabla();
  });

  function cargarTabla() {
    fetch(API_URL + "?action=obtenerGastos")
      .then(res => res.json())
      .then(response => {
        if(response.status === 'success') {
          datosGlobales = response.data.reverse(); // Guardamos los datos más nuevos arriba
          actualizarKPIs(datosGlobales);
          aplicarFiltros(); // Pinta la tabla por primera vez
        } else {
          Swal.fire('Error', response.message, 'error');
        }
      })
      .catch(err => Swal.fire('Error', 'Falla de conexión: ' + err.message, 'error'));
  }

  function actualizarKPIs(gastos) {
    let tGastado = 0, tAbonado = 0, tPendiente = 0;
    
    gastos.forEach(fila => {
      tGastado += parseFloat(fila[3]) || 0;
      tAbonado += parseFloat(fila[4]) || 0;
      tPendiente += parseFloat(fila[5]) || 0;
    });

    document.getElementById('kpiGastado').innerText = formatoMoneda(tGastado);
    document.getElementById('kpiAbonado').innerText = formatoMoneda(tAbonado);
    document.getElementById('kpiPendiente').innerText = formatoMoneda(tPendiente);
  }

  function aplicarFiltros() {
    const textoBuscado = document.getElementById('searchConcepto').value.toLowerCase();
    const estatusSeleccionado = document.getElementById('filterEstatus').value;

    const datosFiltrados = datosGlobales.filter(fila => {
      const coincideTexto = fila[2].toLowerCase().includes(textoBuscado);
      const coincideEstatus = (estatusSeleccionado === 'Todos') || (fila[6] === estatusSeleccionado);
      return coincideTexto && coincideEstatus;
    });

    mostrarDatosEnTabla(datosFiltrados);
  }

  function mostrarDatosEnTabla(gastos) {
    const tbody = document.getElementById('tablaGastos');
    tbody.innerHTML = ''; 

    if (gastos.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5"><i class="fa-solid fa-folder-open fs-1 mb-2 d-block text-light"></i>No se encontraron registros.</td></tr>';
      return;
    }

    let html = '';
    gastos.forEach(fila => {
      const fecha = new Date(fila[1]).toLocaleDateString('es-MX', { timeZone: 'UTC' });
      const estatus = fila[6];
      const badgeClass = 'badge-' + estatus; 
      
      html += `
        <tr>
          <td class="text-muted small">${fecha}</td>
          <td class="text-start fw-semibold">${fila[2]}</td>
          <td>${formatoMoneda(fila[3])}</td>
          <td class="text-success">${formatoMoneda(fila[4])}</td>
          <td class="text-danger fw-bold">${formatoMoneda(fila[5])}</td>
          <td><span class="badge rounded-pill ${badgeClass} px-3 py-2">${estatus}</span></td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }

  function guardarGasto() {
    const fecha = document.getElementById('fechaGasto').value;
    const concepto = document.getElementById('conceptoGasto').value;
    const monto = document.getElementById('montoGasto').value;

    if (!fecha || !concepto || !monto) return Swal.fire('Atención', 'Llena todos los campos del gasto.', 'warning');

    Swal.fire({ title: 'Guardando...', text: 'Registrando en la base de datos', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "registrarGasto", fecha, concepto, monto })
    })
    .then(res => res.json())
    .then(response => {
      if(response.status === 'success') {
        document.getElementById('conceptoGasto').value = '';
        document.getElementById('montoGasto').value = '';
        Swal.fire('¡Gasto Registrado!', 'Se ha guardado en tu historial.', 'success');
        cargarTabla();
      } else {
        Swal.fire('Error', response.message, 'error');
      }
    })
    .catch(err => Swal.fire('Error', 'No se pudo guardar: ' + err.message, 'error'));
  }

  function procesarReembolso() {
    const fecha = document.getElementById('fechaReembolso').value;
    const monto = document.getElementById('montoReembolso').value;
    const notas = document.getElementById('notasReembolso').value;

    if (!fecha || !monto) return Swal.fire('Atención', 'Indica la fecha y el monto.', 'warning');

    Swal.fire({ title: 'Calculando en Cascada...', text: 'Abonando a las facturas más antiguas', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "registrarReembolso", fecha, monto, notas })
    })
    .then(res => res.json())
    .then(response => {
      if(response.status === 'success') {
        document.getElementById('montoReembolso').value = '';
        document.getElementById('notasReembolso').value = '';
        
        if (response.saldoRestante > 0) {
          Swal.fire('¡Abonos Aplicados!', `Se liquidaron las deudas. Tienes un sobrante a favor de: ${formatoMoneda(response.saldoRestante)}`, 'info');
        } else {
          Swal.fire('¡Abonos Aplicados!', 'El reembolso se distribuyó exitosamente.', 'success');
        }
        cargarTabla();
      } else {
        Swal.fire('Error', response.message, 'error');
      }
    })
    .catch(err => Swal.fire('Error', 'No se pudo procesar: ' + err.message, 'error'));
  }

  // Utilidad para exportar la tabla a CSV
  function exportarCSV() {
    if (datosGlobales.length === 0) return Swal.fire('Atención', 'No hay datos para exportar.', 'warning');
    
    // Obtenemos los datos filtrados actuales de la tabla visual
    const filasTabla = document.querySelectorAll("#tablaGastos tr");
    let csvContent = "Fecha,Concepto,Costo Original,Abonado,Saldo Pendiente,Estatus\n";
    
    filasTabla.forEach(row => {
      const cols = row.querySelectorAll("td");
      if(cols.length > 1) {
        const rowData = Array.from(cols).map(col => `"${col.innerText.replace(/"/g, '""')}"`);
        csvContent += rowData.join(",") + "\n";
      }
    });

    const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `Reporte_Gastos_Quinta_${new Date().toISOString().split('T')[0]}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  // Utilidad para formatear números a moneda
  function formatoMoneda(valor) {
    return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(valor || 0);
  }
</script>

</body>
</html>
